<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F1EA">
<title>The Daily Rhythm</title>
<style>
  :root {
    --bg: #F8F1EA;
    --card: #FFFFFF;
    --ink: #3B3A45;
    --muted: #7A6F6A;
    --accent: #B5655A;
    --accent-soft: #F3E1DB;
    --line: #E6D3C9;
    --done: #6F9C85;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1F1D22;
      --card: #2A272E;
      --ink: #EFE8E2;
      --muted: #A99E97;
      --accent: #E08F83;
      --accent-soft: #3A2D2E;
      --line: #3D383F;
      --done: #8FC1A6;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 32px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.7rem; text-align: center; margin: 12px 0 4px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 8px; font-size: 0.95rem; }
  .gentle { text-align: center; color: var(--accent); font-style: italic; font-weight: 600; margin: 0 0 20px; font-size: 0.95rem; }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  h2 { margin: 0 0 4px; font-size: 1.15rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  h2 .num { background: var(--accent); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; flex: none; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 10px; }

  .row {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 4px; border-top: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  .row:first-of-type { border-top: 0; }
  .row input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    border: 2px solid var(--accent); background: transparent;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .box svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .row input:checked + .box { background: var(--done); border-color: var(--done); }
  .row input:checked + .box svg { opacity: 1; }
  .row input:checked ~ .text { opacity: 0.55; text-decoration: line-through; text-decoration-color: var(--muted); }
  .text { flex: 1; }
  .say { display: block; color: var(--accent); font-weight: 700; font-style: italic; margin-top: 2px; }
  .t2 { display: block; margin-top: 10px; }
  .small { display: block; color: var(--muted); font-size: 0.88rem; margin-top: 2px; }

  .pick {
    width: 100%; border: 0; border-radius: 14px; padding: 16px;
    background: var(--accent); color: #fff; font-size: 1.05rem; font-weight: 700;
    margin: 6px 0 12px; font-family: inherit;
  }
  .pick:active { transform: scale(0.99); }

  .card { border: 2px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; background: var(--card); }
  .card.on { border-color: var(--accent); background: var(--accent-soft); }
  .card.flash { animation: flash 0.9s ease; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 6px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .head { width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; display: flex; gap: 14px; align-items: center; padding: 14px; min-height: 64px; }
  .card .box { margin: 0; }
  .card.on .box { background: var(--done); border-color: var(--done); }
  .card.on .box svg { opacity: 1; }
  .title { font-weight: 700; display: block; }
  .meta { color: var(--muted); font-size: 0.85rem; display: block; }
  .detail { display: none; padding: 0 14px 14px 56px; }
  .card.on .detail { display: block; }
  .detail p { margin: 0 0 8px; }
  .detail .say { margin-bottom: 8px; }
  .detail .ex { color: var(--muted); font-style: italic; font-size: 0.9rem; margin: 0 0 8px; }

  /* Timer */
  .timer {
    margin: 14px 0 0 -42px;
    padding: 14px 0 0;
    border-top: 1px dashed var(--line);
    text-align: center;
  }
  .tlabel { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 4px !important; }
  .tface { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .clock {
    font-size: 2.6rem; font-weight: 700; min-width: 4.2ch;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .clock.finished { color: var(--done); }
  .adj {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 1.5rem; font-weight: 700; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .adj:active:not(:disabled) { background: var(--accent); color: #fff; }
  .adj:disabled { opacity: 0.35; }
  .tbtns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .tbtn {
    min-height: 52px; min-width: 112px; border-radius: 14px; padding: 0 20px;
    font: inherit; font-weight: 700; font-size: 1rem;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
  }
  .tbtn.primary { background: var(--accent); color: #fff; }
  .tbtn:active { transform: scale(0.98); }
  .tnote { color: var(--muted); font-size: 0.82rem; margin: 10px 14px 0 !important; min-height: 1.2em; }

  .reset { display: block; margin: 8px auto 0; background: none; border: 2px solid var(--line); color: var(--muted); border-radius: 12px; padding: 12px 20px; font: inherit; font-size: 0.95rem; }
  .done-msg { text-align: center; color: var(--done); font-weight: 700; margin: 10px 0 0; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>The Daily Rhythm</h1>
  <p class="sub">5 minutes once a day. If that feels like too much, do 2.</p>
  <p class="gentle">The most important thing is the gentle consistency.</p>

  <section id="open">
    <h2><span class="num">1</span> Open</h2>
    <p class="hint">Minute 1: Arrive</p>
    <div id="openList"></div>
  </section>

  <section id="middle">
    <h2><span class="num">2</span> Connect</h2>
    <p class="hint">Minutes 2 to 4: choose one card</p>
    <button class="pick" id="pickBtn" type="button">Pick for me</button>
    <div id="cards"></div>
  </section>

  <section id="close">
    <h2><span class="num">3</span> Close</h2>
    <p class="hint">Minute 5: Close</p>
    <div id="closeList"></div>
    <p class="done-msg" id="doneMsg"></p>
  </section>

  <button class="reset" id="resetBtn" type="button">Start fresh</button>
</main>

<script>
(function () {
  var OPEN = [
    { t: "Take one breath together, then say:", q: "For the next few minutes, we are simply making space for us." },
    { t: "Each of you says:", q: "Today I am arriving feeling…", t2: "The other person says:", q2: "Thank you for telling me.", s: "One word or one short sentence is enough. No fixing. Just receiving." }
  ];

  var CLOSE = [
    { t: "Each of you says:", q: "One thing I appreciated about this moment was…" },
    { t: "Then say:", q: "Thank you for meeting me here." },
    { t: "Say:", q: "Thank you for making space for us today." }
  ];

  // secs = default timer length in seconds (the high end of each range)
  var CARDS = [
    { n: "Sitting Close", time: "2–3 min", secs: 180, touch: "Optional",
      body: ["Sit side by side.", "You can have a little space between you, or let your shoulders, arms or legs gently touch.", "Look forward, breathe, and simply notice being near each other."],
      say: "One thing I noticed was…" },
    { n: "Eye Gazing", time: "2 min", secs: 120, touch: "No touch",
      body: ["Sit facing each other.", "Look softly at each other. You can blink, smile, look away for a moment, then return.", "Let it be gentle rather than intense."],
      say: "Looking at you, I noticed…" },
    { n: "Back-to-Back Breathing", time: "3 min", secs: 180, touch: "Backs touching",
      body: ["Sit back-to-back on the couch, floor or chairs.", "Let your backs rest gently against each other.", "Breathe normally. You do not have to match each other’s breathing.", "Just feel the quiet support of another person there."],
      say: "Being close like that felt…" },
    { n: "Holding Hands", time: "2–3 min", secs: 180, touch: "Hands",
      body: ["Sit side by side or facing each other.", "Hold hands gently.", "Notice the warmth, the shape of each other’s hand and the small contact between you."],
      say: "Holding your hand felt…" },
    { n: "Hand on Back", time: "3 min", secs: 180, touch: "Hand on back or shoulder",
      body: ["One person places a gentle hand on the other’s upper back or shoulder.", "Let the hand be still and warm.", "After a minute or two, you may switch if you both want to."],
      say: "That touch felt…" },
    { n: "The Gentle Hug", time: "1–2 min", secs: 120, touch: "Hug",
      body: ["Stand or sit and hold each other gently.", "Let the hug be quiet and simple.", "There is nothing to perform. Just breathe and let your bodies remember the feeling of being close."],
      say: "Thank you for that." },
    { n: "Taking Turns Being Held", time: "4 min total", secs: 240, touch: "Holding",
      body: ["Set a timer for 2 minutes.", "First, one person holds the other.", "The person being held can simply rest there and receive.", "Then switch, if that feels right."],
      say: "Being held felt…" },
    { n: "Appreciation", time: "3–5 min", secs: 300, touch: "Optional",
      body: ["Take turns completing this sentence. Share 2 or 3 each. Keep it simple and true.", "Let the appreciation land. The person receiving can simply say “Thank you.”"],
      say: "One thing I appreciate about you today is…" },
    { n: "A Small Hope", time: "3 min", secs: 180, touch: "Optional",
      body: ["Take turns completing this sentence.", "The other person simply says “I’d like that too” or “Thank you for sharing that with me.”"],
      say: "A small hope I have for us is…" },
    { n: "Remembering Us", time: "3–5 min", secs: 300, touch: "Optional",
      body: ["Take turns answering one of these: “A memory of us that still makes me smile is…” or “Something I used to love about us is…”", "Keep it soft. Choose memories that bring warmth rather than sadness or pressure.", "At the end, say “I’m glad we have that memory.”"],
      say: null }
  ];

  var STEP = 30;        // seconds added or removed by the plus and minus buttons
  var MIN_SECS = 30;
  var MAX_SECS = 1800;

  var KEY = "dailyRhythmState";
  var state = { date: today(), open: [], close: [], card: null, dur: {} };

  function today() { return new Date().toISOString().slice(0, 10); }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (s && s.date === today()) { state = s; if (!state.dur) state.dur = {}; }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var CHECK = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>';

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  /* ---------------------------------------------------------------
     Timer
  --------------------------------------------------------------- */
  var T = { idx: null, running: false, remaining: 0, endAt: 0, tick: null, lock: null, ctx: null, finished: false };

  function dur(i) {
    var v = state.dur[i];
    return (typeof v === "number") ? v : CARDS[i].secs;
  }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function $(id) { return document.getElementById(id); }

  function refreshTimerUI() {
    var clock = $("tClock");
    if (!clock) return;
    clock.textContent = T.finished ? "Done" : fmt(T.remaining);
    clock.className = "clock" + (T.finished ? " finished" : "");
    $("tStart").textContent = T.running ? "Stop" : (T.finished ? "Again" : (T.remaining < dur(T.idx) ? "Resume" : "Start"));
    $("tStart").className = "tbtn" + (T.running ? "" : " primary");
    $("tMinus").disabled = T.running;
    $("tPlus").disabled = T.running;
    var note = $("tNote");
    if (T.running) {
      note.textContent = ("wakeLock" in navigator)
        ? "Your screen will stay awake while the timer runs."
        : "This browser cannot keep the screen awake, so you may want to turn off auto-lock.";
    } else {
      note.textContent = "";
    }
  }

  function onTick() {
    var left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
    T.remaining = left;
    if (left <= 0) { finishTimer(); return; }
    var clock = $("tClock");
    if (clock) clock.textContent = fmt(left);
  }

  function startTimer() {
    if (T.idx === null) return;
    unlockAudio();
    if (T.finished || T.remaining <= 0) { T.finished = false; T.remaining = dur(T.idx); }
    T.endAt = Date.now() + T.remaining * 1000;
    T.running = true;
    requestLock();
    clearInterval(T.tick);
    T.tick = setInterval(onTick, 250);
    refreshTimerUI();
  }

  function stopTimer() {
    if (T.running) T.remaining = Math.max(1, Math.ceil((T.endAt - Date.now()) / 1000));
    T.running = false;
    clearInterval(T.tick);
    releaseLock();
    refreshTimerUI();
  }

  function resetTimer() {
    T.running = false;
    T.finished = false;
    clearInterval(T.tick);
    releaseLock();
    if (T.idx !== null) T.remaining = dur(T.idx);
    refreshTimerUI();
  }

  function finishTimer() {
    clearInterval(T.tick);
    T.running = false;
    T.finished = true;
    T.remaining = 0;
    releaseLock();
    chime();
    try { if (navigator.vibrate) navigator.vibrate([160, 90, 160]); } catch (e) {}
    refreshTimerUI();
  }

  function haltTimer() {
    clearInterval(T.tick);
    T.running = false;
    T.finished = false;
    releaseLock();
  }

  function adjust(delta) {
    if (T.running || T.idx === null) return;
    var next = Math.min(MAX_SECS, Math.max(MIN_SECS, dur(T.idx) + delta));
    state.dur[T.idx] = next;
    T.finished = false;
    T.remaining = next;
    save();
    refreshTimerUI();
  }

  /* Keep the screen awake while the timer runs */
  function requestLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        if (!T.running) { l.release().catch(function () {}); return; }
        T.lock = l;
        l.addEventListener("release", function () { if (T.lock === l) T.lock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  function releaseLock() {
    var l = T.lock;
    T.lock = null;
    if (l) { try { l.release().catch(function () {}); } catch (e) {} }
  }
  // The browser drops the lock when the tab is hidden, so take it again on return
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && T.running) {
      if (!T.lock) requestLock();
      onTick();
    }
  });

  /* Soft chime: a gentle rising bell phrase with a little echo */
  function getCtx() {
    if (!T.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { T.ctx = new AC(); } catch (e) { return null; }
    }
    if (T.ctx.state === "suspended") { try { T.ctx.resume(); } catch (e) {} }
    return T.ctx;
  }
  function unlockAudio() {
    var ctx = getCtx();
    if (!ctx) return;
    try {
      var b = ctx.createBuffer(1, 1, 22050);
      var s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) {}
  }
  function chime() {
    var ctx = getCtx();
    if (!ctx) return;
    var now = ctx.currentTime + 0.05;

    var master = ctx.createGain();
    master.gain.value = 0.55;
    master.connect(ctx.destination);

    // Echo for a spacious, calm feel
    var delay = ctx.createDelay(1.0);
    delay.delayTime.value = 0.32;
    var fb = ctx.createGain(); fb.gain.value = 0.38;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
    var wet = ctx.createGain(); wet.gain.value = 0.4;
    delay.connect(lp); lp.connect(fb); fb.connect(delay);
    lp.connect(wet); wet.connect(master);

    // C5, E5, G5, then a held C6 with a soft G5 beneath it
    var phrase = [
      { f: 523.25, at: 0.0,  len: 2.6 },
      { f: 659.25, at: 0.5,  len: 2.6 },
      { f: 783.99, at: 1.0,  len: 2.8 },
      { f: 1046.5, at: 1.6,  len: 3.8 },
      { f: 783.99, at: 1.6,  len: 3.4, soft: true }
    ];
    // Partials give each note a bell-like warmth
    var partials = [ { m: 1, a: 1.0 }, { m: 2.0, a: 0.28 }, { m: 2.76, a: 0.1 } ];

    phrase.forEach(function (n) {
      var start = now + n.at;
      var peak = n.soft ? 0.07 : 0.2;
      partials.forEach(function (p) {
        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = n.f * p.m;
        var amp = peak * p.a;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(amp, start + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, start + n.len / (1 + (p.m - 1) * 0.5));
        osc.connect(g);
        g.connect(master);
        g.connect(delay);
        osc.start(start);
        osc.stop(start + n.len + 0.1);
      });
    });
  }

  /* ---------------------------------------------------------------
     Rendering
  --------------------------------------------------------------- */
  function renderList(id, items, key) {
    var el = document.getElementById(id);
    el.innerHTML = "";
    items.forEach(function (it, i) {
      var label = document.createElement("label");
      label.className = "row";
      var html = '<input type="checkbox"' + (state[key][i] ? " checked" : "") + '><span class="box">' + CHECK + '</span><span class="text">' + esc(it.t);
      if (it.q) html += '<span class="say">“' + esc(it.q) + '”</span>';
      if (it.t2) html += '<span class="t2">' + esc(it.t2) + '</span>';
      if (it.q2) html += '<span class="say">“' + esc(it.q2) + '”</span>';
      if (it.s) html += '<span class="small">' + esc(it.s) + '</span>';
      html += "</span>";
      label.innerHTML = html;
      label.querySelector("input").addEventListener("change", function (e) {
        state[key][i] = e.target.checked;
        save(); updateDone();
      });
      el.appendChild(label);
    });
  }

  function renderCards(flashIdx) {
    // If the selected card changed, drop any running timer and load the new default
    if (T.idx !== state.card) {
      haltTimer();
      T.idx = state.card;
      T.remaining = state.card !== null ? dur(state.card) : 0;
    }

    var el = document.getElementById("cards");
    el.innerHTML = "";
    CARDS.forEach(function (c, i) {
      var isOn = state.card === i;
      var div = document.createElement("div");
      div.className = "card" + (isOn ? " on" : "") + (flashIdx === i ? " flash" : "");
      div.id = "card" + i;
      var d = '<button type="button" class="head"><span class="box">' + CHECK + '</span><span><span class="title">' + esc(c.n) + '</span><span class="meta">' + esc(c.time) + " · Touch: " + esc(c.touch) + '</span></span></button><div class="detail">';
      c.body.forEach(function (p) { d += "<p>" + esc(p) + "</p>"; });
      if (c.say) d += '<p class="small">At the end, each person says:</p><span class="say">“' + esc(c.say) + '”</span>';
      if (isOn) {
        d += '<div class="timer">' +
               '<p class="small tlabel">Timer</p>' +
               '<div class="tface">' +
                 '<button type="button" class="adj" id="tMinus" aria-label="Subtract 30 seconds">−</button>' +
                 '<span class="clock" id="tClock" role="timer">0:00</span>' +
                 '<button type="button" class="adj" id="tPlus" aria-label="Add 30 seconds">+</button>' +
               '</div>' +
               '<div class="tbtns">' +
                 '<button type="button" class="tbtn primary" id="tStart">Start</button>' +
                 '<button type="button" class="tbtn" id="tReset">Reset</button>' +
               '</div>' +
               '<p class="small tnote" id="tNote"></p>' +
             '</div>';
      }
      d += "</div>";
      div.innerHTML = d;
      div.querySelector(".head").addEventListener("click", function () {
        state.card = state.card === i ? null : i;
        save(); renderCards(); updateDone();
      });
      el.appendChild(div);
    });

    if (state.card !== null) {
      $("tMinus").addEventListener("click", function () { adjust(-STEP); });
      $("tPlus").addEventListener("click", function () { adjust(STEP); });
      $("tStart").addEventListener("click", function () { T.running ? stopTimer() : startTimer(); });
      $("tReset").addEventListener("click", resetTimer);
      refreshTimerUI();
    }
  }

  function updateDone() {
    var allOpen = OPEN.every(function (_, i) { return state.open[i]; });
    var allClose = CLOSE.every(function (_, i) { return state.close[i]; });
    document.getElementById("doneMsg").textContent = (allOpen && allClose && state.card !== null) ? "Complete. Well done for showing up today." : "";
  }

  document.getElementById("pickBtn").addEventListener("click", function () {
    var pool = [];
    CARDS.forEach(function (_, i) { if (i !== state.card) pool.push(i); });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    state.card = pick; save(); renderCards(pick); updateDone();
    var node = document.getElementById("card" + pick);
    if (node && node.scrollIntoView) node.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    haltTimer();
    T.idx = null;
    state = { date: today(), open: [], close: [], card: null, dur: {} };
    save(); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function renderAll() {
    renderList("openList", OPEN, "open");
    renderCards();
    renderList("closeList", CLOSE, "close");
    updateDone();
  }

  load();
  renderAll();
})();
</script>
</body>
</html>
